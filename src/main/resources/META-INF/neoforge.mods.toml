[[mods]]
modId="notebuns_server"
version="1.1.0"
displayName="Hybrid Server Toolkit"
authors="milkycloud-dev"
logoFile="notebuns_server_icon.png"
displayURL="https://github.com/milkycloud-dev/hybrid-server-toolkit"
description='''Серверные правки для гибридного ядра: генерация Aether без ожидания соседних чанков; очередь прегенерации поверх Chunky; книга рецептов после смерти (Youer); выход процесса, если сервер завис на остановке; проверка готовности прегенерации по файлам регионов; клик по слоту вне Bukkit-окна; позиция клиента после возрождения; правила смерти в измерениях как в верхнем мире; полный снимок игрока при смерти с модовыми слотами (/deathbackup); журнал содержимого модовых контейнеров (снимок перед сломом, взрывом и заменой, изменения при сохранении чанков). Только сервер.'''
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
    config="notebuns_server.mixins.json"

[[dependencies.notebuns_server]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.notebuns_server]]
    modId="chunky"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="SERVER"

[[dependencies.notebuns_server]]
    modId="aether"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
